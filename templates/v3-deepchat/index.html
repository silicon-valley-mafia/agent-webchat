<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Agent - preview v3</title>
  <script src="../config.js"></script>
  <!-- Deep Chat web component (MIT), pinned version -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2.4.2/dist/deepChat.bundle.js"></script>
  <style>
    :root { --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #2563eb; }
    [data-theme="dark"] { --bg: #0f172a; --fg: #e5e7eb; --muted: #94a3b8; --line: #1e293b; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    .preview { background: #fef3c7; color: #78350f; font-size: 13px; padding: 6px 12px; text-align: center; }
    .preview a { color: inherit; font-weight: 600; }
    header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0; }
    header .sp { flex: 1; }
    #who, #work { color: var(--muted); font-size: 13px; }
    button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    #notice { background: #dbeafe; color: #1e3a8a; padding: 6px 16px; font-size: 13px; }
    #chat { flex: 1; min-height: 0; display: flex; justify-content: center; }
    #gate { margin: 15vh auto; max-width: 360px; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
    #gate input { padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
    #gate button { background: var(--accent); color: #fff; border: none; padding: 10px; }
    #status { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="preview">Preview v3 — Deep Chat look (text only for now: no attachments, history panel or queue).
      Compare: <a href="../">current page</a> · <a href="../v2/">v2 (Copilot style)</a></div>
    <header>
      <h1 id="title">Agent</h1>
      <span id="who"></span>
      <span id="work" hidden aria-live="polite"></span>
      <span class="sp"></span>
      <button id="info" type="button" title="Session">ⓘ</button>
      <button id="newchat" type="button">New chat</button>
      <button id="theme" type="button" title="Light / dark">🌓</button>
    </header>
    <div id="notice" hidden role="status"></div>
    <form id="gate">
      <p>Enter your access code (the same one as the main page).</p>
      <input id="code" type="password" autocomplete="current-password" placeholder="Access code" required />
      <button type="submit">Start</button>
      <div id="status"></div>
    </form>
    <div id="chat" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
