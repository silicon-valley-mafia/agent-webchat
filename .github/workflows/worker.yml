name: Token Worker - test and deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/token.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set - skipping deploy (deploy manually with wrangler, see README)."
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DIRECTLINE_SECRET
            ACCESS_CODE
        env:
          DIRECTLINE_SECRET: ${{ secrets.DIRECTLINE_SECRET }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
