name: Token Worker - test and deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", "web/files.js", "web/ui.js", "web/voice.js", "web/agents.js", "web/turns.js", "web/stop.js", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/token.test.js test/log.test.js test/features.test.js test/artifact.test.js test/files.test.js test/ui.test.js test/pages.test.js test/voice.test.js test/agents.test.js test/turns.test.js test/stop.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_LOG_TOKEN: ${{ secrets.LOG_REPO_TOKEN != '' }}
      HAS_ACCESS_CODES: ${{ secrets.ACCESS_CODES != '' }}
      HAS_ARTIFACT_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN != '' }}
      HAS_AGENTS: ${{ secrets.AGENTS != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set - skipping deploy (deploy manually with wrangler, see README)."
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DIRECTLINE_SECRET
            ACCESS_CODE
        env:
          DIRECTLINE_SECRET: ${{ secrets.DIRECTLINE_SECRET }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
      # Optional secrets: only uploaded when the matching repo secret exists.
      - name: Set transcript logging token
        if: env.CF_TOKEN != '' && env.HAS_LOG_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOG_REPO_TOKEN: ${{ secrets.LOG_REPO_TOKEN }}
        run: printf '%s' "$LOG_REPO_TOKEN" | npx --yes wrangler@3 secret put LOG_REPO_TOKEN
      - name: Set per-person access codes
        if: env.CF_TOKEN != '' && env.HAS_ACCESS_CODES == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
        run: |
          printf '%s' "$ACCESS_CODES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);if(!o||typeof o!=="object"||Array.isArray(o))throw 0;console.log("ACCESS_CODES OK: "+Object.keys(o).length+" people")}catch(e){console.error("ACCESS_CODES is not a JSON object like {\"code\":\"Name\"}");process.exit(1)}})'
          printf '%s' "$ACCESS_CODES" | npx --yes wrangler@3 secret put ACCESS_CODES
      - name: Set extra agents (TODO #20)
        if: env.CF_TOKEN != '' && env.HAS_AGENTS == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENTS: ${{ secrets.AGENTS }}
        run: |
          printf '%s' "$AGENTS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);if(!o||typeof o!=="object"||Array.isArray(o))throw 0;const ids=Object.keys(o);for(const id of ids){if(!/^[a-z0-9][a-z0-9_-]{0,31}$/.test(id))throw "bad id "+id;const v=o[id];if(!v||!(v.secret||v.secretName))throw "agent "+id+" has no secret"}console.log("AGENTS OK: "+ids.join(", "))}catch(e){console.error("AGENTS must be JSON like {\"coach\":{\"name\":\"VLSI Coach\",\"secret\":\"...\"}}: "+(typeof e==="string"?e:"not a JSON object"));process.exit(1)}})'
          printf '%s' "$AGENTS" | npx --yes wrangler@3 secret put AGENTS
      - name: Set separate artifact-repo token
        if: env.CF_TOKEN != '' && env.HAS_ARTIFACT_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_REPO_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN }}
        run: printf '%s' "$ARTIFACT_REPO_TOKEN" | npx --yes wrangler@3 secret put ARTIFACT_REPO_TOKEN
      - name: Optional features status
        if: env.CF_TOKEN != ''
        run: |
          echo "Transcript logging: ${{ env.HAS_LOG_TOKEN == 'true' && 'ON' || 'off (add LOG_REPO_TOKEN)' }}"
          echo "Attachments saved:  ${{ (env.HAS_LOG_TOKEN == 'true' || env.HAS_ARTIFACT_TOKEN == 'true') && 'ON (token must include agent-webchat-artifcats-1)' || 'off (add LOG_REPO_TOKEN)' }}"
          echo "Per-person codes:   ${{ env.HAS_ACCESS_CODES == 'true' && 'ON' || 'off (add ACCESS_CODES)' }}"
          echo "Extra agents:       ${{ env.HAS_AGENTS == 'true' && 'ON' || 'off (add AGENTS, see docs/AGENTS.md)' }}"
