name: one-shot patch71
on:
  push:
    branches: [feat/56-github-look]
    paths: ['.github/workflows/patch71.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/p71/patch71.py
      - run: |
          git rm -rq .github/p71
          git config user.name 'Deepesh J'
          git config user.email '263164968+silicon-valley-mafia@users.noreply.github.com'
          git add -A web worker
          git commit -m "feat(#56): vendor highlight.js $(cat /tmp/hl/version.txt) (BSD-3-Clause) + verilog/vhdl/tcl/..., alert + code colour CSS, prompt box fix, timestamps use raw prompt text, codeHighlight switch"
          git push
