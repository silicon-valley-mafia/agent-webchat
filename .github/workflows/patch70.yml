name: one-shot patch70
on:
  push:
    branches: [feat/56-58-gfm-times]
    paths: ['.github/p70/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/p70/patch70.py
      - run: |
          git rm -rq .github/p70
          git config user.name 'Deepesh J'
          git config user.email '263164968+silicon-valley-mafia@users.noreply.github.com'
          git add -A web worker
          git commit -m 'feat(#56 #57 #58): wire gfm.js / gfm.css into both pages, config switches, raw Markdown for Copy / Reuse, gfm tests in CI'
          git push
