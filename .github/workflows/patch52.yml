name: one-shot patch52
on:
  push:
    branches: ['feat/portable-repos-52']
    paths: ['.github/workflows/patch52.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .github/p52/patch52.py
      - run: for f in web/*.js; do node --check "$f" || exit 1; done
      - run: cd worker && node --test test/*.test.js
      - run: |
          git rm -rq .github/p52
          git config user.name 'Deepesh J'
          git config user.email '263164968+silicon-valley-mafia@users.noreply.github.com'
          git add -A worker web
          git commit -m 'feat(#52 part 2): older logs repos read for History / transcripts / owner records; /health?repos=1; page links from /token'
          git push
