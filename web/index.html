<!DOCTYPE html>
<html lang="en" data-theme="light" data-width="wide" data-skin="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Agent Web Chat</title>
  <link rel="stylesheet" href="app.css" />
  <script src="config.js"></script>
  <!-- Web Chat pinned (research TODO #2/#28: "latest" changes under us). If the pinned file can't load, fall back to latest. -->
  <script crossorigin="anonymous" src="https://cdn.botframework.com/botframework-webchat/4.19.2/webchat.js"></script>
  <script>window.WebChat || document.write('<script crossorigin="anonymous" src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"><\/script>');</script>
</head>
<body>
  <div id="app">
    <header>
      <div class="left">
        <h1 id="title">Agent</h1>
        <span id="who"></span>
        <span id="workstate" hidden aria-live="polite"></span>
      </div>
      <div class="right">
        <span id="upstate" title="Attached files being saved to GitHub"></span>
        <span id="logstate" title="Transcript logging status"></span>
        <button id="expandall" type="button" hidden title="Expand or collapse all long replies">Expand all</button>
        <button id="historybtn" type="button" hidden title="Saved conversations">History</button>
        <button id="newchat" type="button" hidden title="Start a fresh conversation">New chat</button>
        <button id="clearchat" type="button" hidden title="Clear the screen only - same session, the agent still remembers it">Clear</button>
        <button id="sessionbtn" type="button" hidden title="Show this session's id" aria-label="Session info">ⓘ Session</button>
        <button id="download" type="button" hidden title="Download this conversation as Markdown">⬇ Download</button>
        <button id="groupbtn" type="button" title="Experimental: one prompt to several agents (opens the group page)" onclick="location.href='group.html'">🧪 Group</button>
        <button id="widthbtn" type="button" title="Width" aria-label="Toggle wide / narrow layout">↔</button>
        <button id="skinbtn" type="button" title="Skin" aria-label="Change skin">🎨</button>
        <button id="theme" type="button" title="Theme">🌓</button>
        <button id="notify" type="button" hidden title="Notifications">🔕</button>
        <button id="forget" type="button" hidden title="Remove the saved access code from this browser">Forget code</button>
      </div>
    </header>
    <div id="notice" hidden role="status"><span id="noticetext"></span><button id="noticeclose" type="button" title="Dismiss" aria-label="Dismiss">✕</button></div>
    <form id="gate">
      <p>Enter your access code to start a conversation.<br /><small>It is remembered in this browser, so you only type it once.</small></p>
      <input id="code" type="password" autocomplete="current-password" placeholder="Access code" required />
      <button type="submit">Start</button>
      <div id="status"></div>
    </form>
    <div id="chatwrap" hidden></div>
    <div id="queued" hidden aria-live="polite" aria-label="Messages waiting for the agent to finish"></div>
    <div id="staged" hidden aria-label="Attached files waiting to be sent"></div>
    <div id="dropzone" hidden><div>Drop files to attach them to your next message</div></div>
    <section id="history" hidden>
      <div class="head">
        <h2 id="historytitle">Conversation history</h2>
        <button id="historyclose" type="button">Close ✕</button>
      </div>
      <div id="historybody"></div>
    </section>
  </div>
  <script>(window.AGENT_WEBCHAT_CONFIG || {}).groupChat === false && (document.getElementById("groupbtn").hidden = true);</script>
  <script src="files.js"></script>
  <script src="ui.js"></script>
  <script src="skins.js"></script>
  <script src="markdown.js"></script>
  <script src="sessions.js"></script>
  <script src="queue.js"></script>
  <script src="voice.js"></script>
  <script src="agents.js"></script>
  <script src="turns.js"></script>
  <script src="stop.js"></script>
  <script src="app.js"></script>
</body>
</html>
