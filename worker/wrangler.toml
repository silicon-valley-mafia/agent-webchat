name = "agent-webchat-token"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://silicon-valley-mafia.github.io"
DIRECTLINE_DOMAIN = "https://directline.botframework.com"
RATE_LIMIT_PER_MIN = "10"
LOG_RATE_LIMIT_PER_MIN = "30"
LOG_REPO = "silicon-valley-mafia/agent-webchat-logs"
LOG_TZ_OFFSET_MIN = "330"   # transcripts use IST (UTC+05:30)

# Secrets - NEVER put them in this file. Set them with:
#   npx wrangler secret put DIRECTLINE_SECRET
#   npx wrangler secret put ACCESS_CODE
#   npx wrangler secret put GITHUB_LOG_TOKEN   (optional - enables transcript logging)
