name: One-shot - TODO #55 patch (app.js + tests)

on:
  push:
    branches: [feat/turn-signals-55]
    paths: [".github/workflows/patch55.yml", ".github/patch55.py"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/patch55.py
      - name: Check and test
        working-directory: worker
        run: |
          node --check ../web/app.js
          node --check ../web/turns.js
          node --test test/turns.test.js
      - name: Commit
        run: |
          set -e
          git config user.name "Deepesh J"
          git config user.email "263164968+silicon-valley-mafia@users.noreply.github.com"
          git add -A web/app.js worker/test/turns.test.js worker/test/turns55.part.js
          git commit -m "feat(#55): app.js - typing notes and endOfConversation go through AgentTurn.kind; tests appended"
          git push
