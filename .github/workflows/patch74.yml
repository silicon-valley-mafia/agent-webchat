name: one-shot patch74
on:
  push:
    branches: [fix/reuse-sendbox]
    paths: ['.github/workflows/patch74.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/p74/patch74.py
      - run: |
          git rm -rq .github/p74
          git config user.name 'Deepesh J'
          git config user.email '263164968+silicon-valley-mafia@users.noreply.github.com'
          git add -A web worker
          git commit -m 'fix(#50 #45 #47): Reuse, starter chips and Hand-off use the multi-line send box (Web Chat 4.19 textarea) and Web Chat store'
          git push
