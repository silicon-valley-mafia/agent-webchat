name: one-shot patch45
on:
  push:
    branches: ['feat/batch-bc-45-47']
    paths: ['.github/workflows/patch45.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .github/p45/patch45.py
      - run: for f in web/*.js; do node --check "$f" || exit 1; done
      - run: cd worker && node --test test/*.test.js
      - run: |
          git rm -rq .github/p45
          git config user.name 'Deepesh J'
          git config user.email '263164968+silicon-valley-mafia@users.noreply.github.com'
          git add -A worker web
          git commit -m 'feat(#45, #46, #47, #20): starter prompts, plan board, hand-off button, History filter by agent'
          git push
